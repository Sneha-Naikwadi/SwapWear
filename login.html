<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SwapWear</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">

        <i class="fa-solid fa-shirt"></i>

        <span>
            SwapWear
        </span>

    </div>


    <a href="index.html"
       class="home-link">

        <i class="fa-solid fa-arrow-left"></i>

        Home

    </a>

</header>



<!-- ================= LOGIN ================= -->

<main class="login-section">


    <!-- IMAGE -->

    <div class="login-image">

        <img
            src="images/login.png"
            alt="SwapWear Login"
        >

    </div>


    <!-- CARD -->

    <div class="login-card">


        <div class="login-heading">

            <div class="login-icon">

                <i class="fa-solid fa-right-to-bracket"></i>

            </div>


            <h1>
                Welcome Back
            </h1>


            <p>
                Login to continue swapping clothes.
            </p>

        </div>



        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>


                <div class="input-wrapper">

                    <i class="fa-solid fa-envelope"></i>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                    >

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>



            <!-- OPTIONS -->

            <div class="form-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <a
                    href="#"
                    id="forgotPassword"
                >
                    Forgot Password?
                </a>

            </div>



            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="message"
            ></div>



            <!-- BUTTON -->

            <button
                type="submit"
                id="loginButton"
                class="login-submit"
            >

                <span id="loginButtonText">
                    Login
                </span>

                <i class="fa-solid fa-arrow-right"></i>

            </button>


        </form>



        <!-- SIGNUP -->

        <div class="signup-link">

            <p>

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</main>



<footer>

    <p>
        © 2026 SwapWear.
        All Rights Reserved.
    </p>

</footer>


<script src="login.js"></script>

</body>
</html>
